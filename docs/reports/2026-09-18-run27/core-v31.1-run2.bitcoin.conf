# Bitcoin Core v31.1 -- IBD benchmark, second run (2026-09-18).
#
# WHY A SECOND RUN. The first (/mnt/nvme8tb/core-oracle, 19 h 40 m 09 s) was
# one continuous sync from an empty datadir, but its process was restarted once
# (12 s at 06:12Z) to move it under systemd. That is too easy to misread, so
# this run is launched under its own unit from the first second and is never
# touched until it leaves IBD.
#
# PROTOCOL -- identical to the first run and to bmc run 27:
#   same device (/mnt/nvme8tb, Corsair MP600 PRO XT), fresh datadir,
#   dbcache=8192, txindex + coinstatsindex + blockfilterindex, prune=0,
#   maxconnections=48 (download peers are Core's fixed 8), public network via
#   DNS seeds, default logging, Nice=0 (set in the unit).
#
# DIFFERENCES from the first run, none of which touch validation:
#   - ports 8338/8339 and ZMQ 28434, so it cannot collide with the oracles
#     (8333/8335, 8336/8337) or production (8332/8331);
#   - no sixteen loopback binds (they existed so the oracle could serve
#     loopback peers; nothing dials this node);
#   - shrinkdebugfile=0, so if anything ever restarts it, the log keeps the
#     whole timeline instead of trimming to the last 10 MB. It changes nothing
#     while the node runs.

datadir=/mnt/nvme8tb/bench/core31

port=8338
rpcport=8339
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
server=1
listen=1
maxconnections=48

dbcache=8192
txindex=1
coinstatsindex=1
blockfilterindex=1
prune=0

printtoconsole=0
shrinkdebugfile=0

zmqpubhashblock=tcp://127.0.0.1:28434
zmqpubhashtx=tcp://127.0.0.1:28434
zmqpubrawblock=tcp://127.0.0.1:28434
zmqpubrawtx=tcp://127.0.0.1:28434
