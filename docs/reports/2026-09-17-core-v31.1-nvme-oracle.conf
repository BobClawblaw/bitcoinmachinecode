# Bitcoin Core v31.1 -- second oracle / IBD baseline, on the 8 TB NVMe.
#
# Created 2026-09-17. Two jobs at once:
#   1. Its initial block download IS the queued Core benchmark (RESUME_2026-09-17).
#   2. When it reaches the tip it becomes a permanent oracle on fast storage.
#
# It does NOT touch /storage/core-oracle. Own datadir, own ports, own ZMQ
# endpoint. The existing oracle keeps P2P 8333 / RPC 8335; production bmc keeps
# 8332/8331. This node takes 8336/8337.
#
# Version: v31.1, commit 9be056a8a72b624dae9623b2f7bded92c2a21c91.
#   v31.1 is BOTH the latest final Core release and the version every prior
#   baseline used, so the comparison stays valid and stays reproducible.
#
# Device: /mnt/nvme8tb, Corsair MP600 PRO XT, ext4, measured 4.7 GB/s write
#   / 5.4 GB/s read (16 GiB O_DIRECT). Run 27 MUST use this same device or the
#   comparison measures storage instead of software -- that is exactly why the
#   run 26 wall-clock comparison was withdrawn.
#
# LOGGING: Core DEFAULT. No -debug categories, no logtimemicros, no
#   logthreadnames. A first attempt on 2026-09-17 ran with debug=net and
#   debug=validation; that writes tens of GB over a full IBD and measurably
#   slows it, so its wall clock would not have been comparable to the
#   unhandicapped 19h 14m v31.1 figure. That datadir was abandoned at height
#   ~152k and moved to core-oracle-ABORTED-logging-handicap-20260917-2326.
#   Per-segment timings come from the UpdateTip lines, which are present at the
#   default level -- no debug category is needed for them.
#
# WHAT IS NOT A DEFAULT, AND WHY: dbcache=8192 and the three indexes below.
#   Those are the documented benchmark protocol (docs/reports/
#   2026-09-11-ibd-vs-core.md: "Both nodes: dbcache=8192"; RESUME_2026-09-17:
#   txindex + coinstatsindex + blockfilterindex). They are what the baseline
#   ran, so they stay. par is left at Core's default -- the old oracle's par=4
#   is a handicap, not a baseline setting.

datadir=/mnt/nvme8tb/core-oracle

# --- ports: must not collide with 8333/8335 (oracle) or 8332/8331 (production)
port=8336
rpcport=8337
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
server=1
listen=1
maxconnections=48

# --- benchmark protocol: fresh datadir, all three indexes, dbcache=8192
dbcache=8192
txindex=1
coinstatsindex=1
blockfilterindex=1
prune=0

# --- peers: public network via DNS seed, same as every prior baseline.
# Block download concurrency is NOT configurable -- MAX_OUTBOUND_FULL_RELAY
# _CONNECTIONS pins it at 8 outbound full-relay peers whatever maxconnections
# says. So "8 download peers" is automatic here, not configured.

# --- logging: default level. printtoconsole=0 only chooses the DESTINATION
# (debug.log rather than the systemd journal); it is not a verbosity change.
printtoconsole=0

# --- sixteen loopback binds on 8336, mirroring the old oracle's pattern, so a
# benchmark node can later dial sixteen distinct "peers" that are all this node.
bind=127.0.0.1:8336
bind=127.0.0.2:8336
bind=127.0.0.3:8336
bind=127.0.0.4:8336
bind=127.0.0.5:8336
bind=127.0.0.6:8336
bind=127.0.0.7:8336
bind=127.0.0.8:8336
bind=127.0.0.9:8336
bind=127.0.0.10:8336
bind=127.0.0.11:8336
bind=127.0.0.12:8336
bind=127.0.0.13:8336
bind=127.0.0.14:8336
bind=127.0.0.15:8336
bind=127.0.0.16:8336

# --- ZMQ on 28433 (the old oracle owns 28432)
zmqpubhashblock=tcp://127.0.0.1:28433
zmqpubhashtx=tcp://127.0.0.1:28433
zmqpubrawblock=tcp://127.0.0.1:28433
zmqpubrawtx=tcp://127.0.0.1:28433
