# ARM stability-run configuration (bmc-arm.service) -- derived from
# config/bitcoin.conf with dbcache halved: this box shares its DGX Spark
# unified memory with a vLLM worker (~107GB pinned of 121GB), so the daemon
# must live in ~4GB and leave the rest of the system alone. The bulk LSM
# self-sizes from dbcache (bulk_slots/bulk_blob scale with it).

# --- Network ---
# rpcport MUST differ from port= below: the daemon's own P2P listener owns
# 8332, and the embedded RPC server loses that bind and comes up RPC-less.
# This was an uncommitted operational edit until 2026-08-26, when a merge
# cleanup reverted it and every subsequent boot silently lost RPC.
rpcport=8331
port=8332
listen=1
maxconnections=256

# --- RPC auth (HTTP Basic; matches bitcoind's rpcuser/rpcpassword) ---
rpcuser=bitcoin
rpcpassword=bitcoin

# --- Blocks ---
dbcache=2048
prune=0
blocksonly=0

# --- Pruning (uncomment to enable)
# prune=5000

# --- Privacy ---
privacy=1
whitelist=rpc

# --- Indexing ---
# Enable UTXO, address, and transaction indexes for API queries
txindex=1

# --- Performance ---
paranoid=0
# Keep the local fully-synced Core oracle as one preferred peer, and let the
# rest of the catch-up pool come from internet seeds (multi-client download).
addnode=127.0.0.1
# --- Peer sourcing (Bitcoin Core key names) ---
# All four are read at boot. addnode/seednode/connect may be REPEATED
# (up to 32 each); only the default P2P port 8333 is supported for named
# peers, and an entry with any other port is rejected rather than
# silently dialled on 8333.
#
#   dnsseed=1            # query the DNS seeds (default 1)
#   seednode=<ip>        # getaddr from this node, then drop it
#   addnode=<ip>         # prefer this peer, and never auto-evict it
#   connect=<ip>         # use ONLY these peers; disables all discovery
#   connect=0            # no automatic connections at all
#
# As in Core, connect= implies dnsseed=0 and listen=0 unless those keys
# are set explicitly (order in this file does not matter).

# --- Chain / storage (Bitcoin Core key names) ---
#   prune=0              # 0 off, 1 manual-only, >=550 a size budget in MiB
#   checkblocks=6        # trailing blocks verified at boot; 0 = all
#   checklevel=3         # 0 none, 1 index, 2 +layout, 3 +body hash, 4 +PoW/merkle
#   stopatheight=0       # stop the download at this height; 0 = follow the tip
#
# NOT IMPLEMENTED, and warned about at boot rather than ignored:
#   txindex     -- there is no txid->block index in this node
#   assumevalid -- block connection performs NO script/signature verification,
#                  so there is nothing for it to skip. checklevel=4 means
#                  PoW + merkle integrity, NOT full consensus validation.

# 2026-08-22: re-fetch witness-complete blocks >= 481824 from the local Core oracle
# (loopback 8333) at disk speed. Remove connect= to return to public peers.
# oracle is mid-IBD; cap the download at what it has, raise as it advances
stopatheight=0
