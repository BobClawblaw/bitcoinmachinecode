# =============================================================================
# bitcoin.sample.conf -- every setting this node reads, at its DEFAULT value.
#
# Copy to config/bitcoin.conf and edit. Each line below is COMMENTED OUT and
# shows the value the node uses when the key is absent, so an uncommented line
# only matters if you change it. Keys are Bitcoin Core's names and, where Core
# has a default, the same default -- a difference is called out in the comment.
#
# THIS FILE IS TRACKED IN GIT. config/bitcoin.conf IS NOT (it holds your RPC
# password). Never put credentials, keys or private addresses in this file.
#
# Anything the node does not recognise is ignored with a message on stderr,
# as Core does. Values are parsed once at start-up; a change needs a restart.
# =============================================================================

# --- chain -------------------------------------------------------------------
# Which chain to run. One of: main, testnet4, regtest. `testnet4=1`/`regtest=1`
# are accepted as Core spells them and set this for you.
#chain=main
#testnet4=0
#regtest=0

# --- RPC (read by the embedded RPC server, not the config parser) ------------
# With no rpcuser AND rpcpassword the RPC server does not start at all.
# Put these in bitcoin.conf, never here.
#rpcport=8332
#rpcuser=
#rpcpassword=

# --- P2P: listening ----------------------------------------------------------
#port=8333                  # P2P port for the selected chain (testnet4 48333, regtest 18444)
#listen=1                   # accept inbound connections
#bind=                      # address to listen on; empty = all interfaces (IPv4 and IPv6)
#maxconnections=200         # total connection budget

# --- P2P: outbound -----------------------------------------------------------
#connect=                   # dial ONLY these peers; disables all discovery (repeatable)
#addnode=                   # also dial these, alongside discovery (repeatable)
#seednode=                  # query these once for addresses, then drop (repeatable)
#dnsseed=1                  # query the chain's DNS seeds when short of peers
#timeout=5000               # connect timeout, milliseconds
#peertimeout=60             # drop a peer silent this long, seconds
#maxreceivebuffer=5000      # per-peer receive buffer, x1000 bytes

# --- Privacy: what a proxy actually changes ----------------------------------
# Setting `proxy` (or `onion`) does more than route connections. With one set
# this node also:
#   * stops asking the system resolver for peer hostnames -- the name is
#     handed to the proxy instead (SOCKS5 ATYP DOMAINNAME), so no plaintext
#     DNS query says which peers it is about to contact;
#   * stops querying the DNS seeds for the same reason -- seed a peers2.dat,
#     or use addnode=/connect=;
#   * gives every connection its own SOCKS5 credentials, so tor puts each on
#     its own circuit (`proxyrandomize`);
#   * never advertises its own clearnet address to an onion or I2P peer.
# For a Tor-only node the usual set is:
#     onion=127.0.0.1:9050
#     onlynet=onion
#     discover=0
# which also stops the node learning or announcing a clearnet address at all.

# --- Privacy: proxies and anonymity networks ---------------------------------
# A proxy here changes how NAMES are resolved as well as how connections are
# made: with a proxy set, this node never asks the system resolver for a peer
# hostname (the proxy resolves it), because a local DNS lookup would tell the
# resolver exactly which peers the node is about to contact. The DNS seeds are
# skipped for the same reason -- seed a book or use addnode=/connect= instead.
#proxy=                     # SOCKS5 for every network, ip:port (e.g. 127.0.0.1:9050)
#onion=                     # SOCKS5 for .onion only; defaults to `proxy`; "0" disables onion
#proxyrandomize=1           # random SOCKS5 credentials per connection = one Tor circuit each
#dns=1                      # allow the system resolver at all (0 = never)
#discover=1                 # learn and announce our own address (0 = never; use behind Tor)
#externalip=                # announce this address instead of a discovered one
#onlynet=                   # restrict to these networks (repeatable): ipv4 ipv6 onion i2p cjdns

# --- Privacy: Tor ------------------------------------------------------------
# Reaching .onion peers needs only `onion=` (or `proxy=`). The control port is
# for creating our OWN onion service. Cookie authentication is used when the
# control port offers it; torpassword is the fallback.
#torcontrol=127.0.0.1:9051  # tor control port
#torpassword=               # only if your tor uses HashedControlPassword
#listenonion=1              # create an onion service for inbound (see note below)

# --- Privacy: I2P ------------------------------------------------------------
# Needs a router with the SAM bridge enabled (i2pd has it on by default).
# The destination is persisted in the data directory as i2p_private_key, so
# the node keeps one .b32.i2p address across restarts.
#i2psam=                    # SAM bridge, ip:port (e.g. 127.0.0.1:7656); empty = i2p off
#i2pacceptincoming=1        # accept inbound I2P (see note below)

# --- Privacy: CJDNS ----------------------------------------------------------
# A CJDNS address is an fc00::/8 IPv6 address on cjdns's tun interface, so
# this needs working IPv6 on the host. Like Core, the node cannot detect a
# cjdns interface: you have to say it is there.
#cjdnsreachable=0

# --- Indexes and storage -----------------------------------------------------
#txindex=0                  # NOTE: built automatically when txindex.dat exists; this key is informational
#addrindex=0                # EXTENSION (no Core equivalent): address index for getaddress* RPCs
#prune=0                    # 0 off, 1 manual-only, >=550 target size in MiB
#dbcache=1024               # UTXO cache, MiB (Core defaults to 450; this node to 1024)
#par=0                      # script-verification threads; 0 = auto

# --- Mempool -----------------------------------------------------------------
#maxmempool=300             # MiB
#mempoolexpiry=336          # hours
#minrelaytxfee=0.00001000   # BTC/kvB
#incrementalrelayfee=0.00001000
#dustrelayfee=0.00003000
#mempoolfullrbf=1
#limitancestorcount=25
#limitancestorsize=101      # kvB
#limitdescendantcount=25
#limitdescendantsize=101    # kvB
#datacarrier=1
#datacarriersize=100000     # vbytes (Core v31 default)
#acceptnonstdtxn=0
#blocksonly=0               # 1 = do not relay transactions

# --- Validation --------------------------------------------------------------
# assumevalid is PARSED AND IGNORED on purpose: this node verifies every
# script in every block, and honouring assumevalid would mean skipping that.
#assumevalid=
#checkblocks=6
#checklevel=3
#stopatheight=0

# --- Resource limits ---------------------------------------------------------
#maxuploadtarget=0          # MiB per 24h; 0 = no limit

# --- ZMQ notifications -------------------------------------------------------
#zmqpubhashblock=
#zmqpubhashtx=
#zmqpubrawblock=
#zmqpubrawtx=
#zmqpubsequence=

# --- Wallet ------------------------------------------------------------------
#signer=                    # external signer command (Core -signer / HWI)

# =============================================================================
# NOTES ON WHAT IS NOT YET IMPLEMENTED, so a setting here is never a promise:
#
#   listenonion / i2pacceptincoming -- parsed, and the machinery exists and is
#   tested (daemon/torcontrol.c creates an onion service; daemon/i2psam.c can
#   STREAM ACCEPT), but neither is wired into the serve loop yet. OUTBOUND
#   onion and I2P work; inbound over those networks does not. CJDNS inbound
#   does work, over the IPv6 listener.
#
#   IPv6 has no separate key: the node listens on both stacks when `listen=1`
#   (a v6-only socket beside the v4 one, so they cannot collide) and dials
#   IPv6 peers whenever the host has IPv6. Use `onlynet` to restrict.
# =============================================================================
