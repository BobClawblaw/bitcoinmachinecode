# =============================================================================
# bitcoin.sample.conf -- the complete configuration reference for this node.
#
# Every key the node reads appears below exactly once, COMMENTED OUT, at the
# value the node uses when the key is absent. An uncommented line therefore
# only matters if you change it. Keys are Bitcoin Core's names, units and
# defaults; wherever this node's default differs from Core's, the comment says
# so. Keys prefixed `bmc.` are extensions with no Core equivalent.
#
# Copy to config/bitcoin.conf and edit. THIS FILE IS TRACKED IN GIT;
# config/bitcoin.conf IS NOT. Credentials (rpcpassword, torpassword, rpcauth
# secrets) never belong in this file. The wallet passphrase does not belong
# in EITHER file: it comes from a root-owned file OUTSIDE the datadir (see
# walletpassfile) or from $BMC_WALLET_PASS.
#
# A key the node does not recognise is ignored with a note on stderr, as Core
# does. A Core option the node knows but does not implement is named at every
# start-up. Values are read once at start-up; a change needs a restart.
# Repeatable keys (addnode, connect, seednode, onlynet, rpcallowip, rpcauth,
# whitelist, whitebind) may be given more than once; every other key is
# last-one-wins.
# =============================================================================

# --- Chain -------------------------------------------------------------------
# One of: main, testnet4, signet, regtest. The bool forms below are accepted
# as Core spells them and set chain= for you. Each chain keeps its own
# subdirectory under the datadir (main included) with its own logs/ and
# .cookie, so chains never share state.
#chain=main
#testnet4=0
#regtest=0
#signet=0
# Custom signet challenge script, hex. Only meaningful with chain=signet; it
# also fixes the network magic, so two signets with different challenges
# cannot talk to each other. Empty = the public signet's 1-of-2 challenge.
#signetchallenge=

# --- RPC ---------------------------------------------------------------------
# Cookie authentication is on by default and uses Core's format exactly
# ("__cookie__:<64 hex>", mode 0600): written at start-up, DELETED at
# shutdown so a dead node leaves no usable credential. rpcuser/rpcpassword
# and rpcauth work alongside it. Default port follows the chain: 8332 main,
# 48332 testnet4, 38332 signet, 18443 regtest.
#rpcport=8332
#rpcuser=                   # plaintext credential pair; put it in bitcoin.conf, never here
#rpcpassword=
#rpcauth=                   # <user>:<salt>$<hmac-sha256-hex>, Core's share/rpcauth format; up to 8 entries
#rpccookiefile=             # default: <datadir>/<chain>/.cookie
# The listener binds loopback unless rpcbind names an IPv4 address AND at
# least one rpcallowip is given; rpcbind without rpcallowip is ignored with a
# warning, as in Core. 127.0.0.0/8 and ::1 are always allowed. A malformed
# rpcallowip is a start-up error, not a warning.
#rpcbind=                   # IPv4 address to listen on; empty = 127.0.0.1
#rpcallowip=                # subnet allowed to connect (repeatable, max 16): 192.168.1.0/24, 10.0.0.5

# --- P2P: listening ----------------------------------------------------------
# The node listens on both IP stacks when listen=1 (a v6-only socket beside
# the v4 one); there is no separate IPv6 key. Default port follows the chain:
# 8333 main, 48333 testnet4, 38333 signet, 18444 regtest.
#port=8333
#listen=1                   # accept inbound connections
#bind=                      # address[:port] to listen on; empty = all interfaces
#whitebind=                 # [noban@]addr:port -- an extra listener whose peers get those permissions (max 8)
#maxconnections=200         # total connection budget (Core before v31: 125); range 16..4096
# Outbound slot classes (Core compiles these in). Their sum must be below
# maxconnections or the whole budget reverts to defaults.
#bmc.maxoutbound=8          # full-relay outbound peers
#bmc.blockrelayonly=2       # block-relay-only outbound peers
#bmc.feelers=1              # concurrent feeler connections
#bmc.feelerinterval=120000  # ms between feelers

# --- P2P: outbound -----------------------------------------------------------
# Peer entries take host or host:port. connect= disables dnsseed and listen
# unless those are set explicitly in the same file; connect=0 means no
# automatic connections at all.
#connect=                   # dial ONLY these peers; disables discovery (repeatable)
#addnode=                   # also dial and keep these, alongside discovery (repeatable)
#seednode=                  # ask these for addresses once, then drop (repeatable)
#dnsseed=1                  # query the chain's DNS seeds when short of peers
#timeout=5000               # connect timeout, ms (1000..120000)
#peertimeout=60             # drop a peer silent this long, seconds (5..3600)
#maxreceivebuffer=5000      # per-peer receive buffer, x1000 bytes
#maxsendbuffer=1000         # per-peer send buffer, x1000 bytes
# Peer quality (extensions). A peer delivering below peerminbps for
# peerminticks consecutive ticks is dropped as dead weight, but never while
# fewer than peerminusable peers are connected.
#bmc.peerminbps=32768       # bytes/s a peer must sustain (1024..10485760)
#bmc.peerminticks=3         # consecutive slow ticks before eviction (1..60)
#bmc.peerminusable=8        # eviction floor: keep at least this many peers (1..256)
#bmc.peerpool=2048          # candidate pool drawn from the address book (16..8192)

# --- Privacy: proxies --------------------------------------------------------
# A proxy changes how NAMES are resolved as well as how connections are made.
# With proxy= set the node never asks the system resolver for a peer hostname
# (the name goes to the proxy, SOCKS5 ATYP DOMAINNAME), skips the DNS seeds
# for the same reason (seed a peers2.dat or use addnode=/connect=), gives
# every proxied connection its own random SOCKS5 credentials so Tor puts
# each on its own circuit, and never advertises a clearnet address to an
# onion or I2P peer. onion= alone routes .onion peers and nothing else. A
# Tor-only node is: onion=127.0.0.1:9050, onlynet=onion, discover=0.
#proxy=                     # SOCKS5 for every network, ip:port (e.g. 127.0.0.1:9050)
#onion=                     # SOCKS5 for .onion only; empty = same as proxy; "0" disables onion
#proxyrandomize=1           # fresh SOCKS5 credentials per connection = one Tor circuit each
#dns=1                      # allow the system resolver at all (0 = never)
#discover=1                 # learn and announce our own address (0 = never; use behind Tor)
#externalip=                # announce this IPv4 address instead of a discovered one
#onlynet=                   # restrict to these networks (repeatable, max 6): ipv4 ipv6 onion i2p cjdns

# --- Privacy: Tor ------------------------------------------------------------
# Reaching .onion peers needs only onion= (or proxy=). The control port is for
# creating our OWN v3 onion service: the node holds the control connection
# for its lifetime (the service dies with the node), listens on a loopback-
# only socket at the chain port + 1 and announces the onion address to onion
# peers only. Cookie authentication is used when the control port offers it;
# torpassword is the fallback. The service account needs read access to
# tor's control cookie (under systemd: SupplementaryGroups=debian-tor).
#torcontrol=127.0.0.1:9051  # tor control port
#torpassword=               # only if your tor uses HashedControlPassword
#listenonion=1              # create an onion service for inbound

# --- Privacy: I2P ------------------------------------------------------------
# Needs a router with the SAM bridge enabled (i2pd has it on by default).
# The destination is persisted in the datadir as i2p_private_key, so the
# node keeps one .b32.i2p address across restarts. I2P is outbound only:
# inbound I2P streams are not accepted, so i2pacceptincoming is reserved and
# has no effect.
#i2psam=                    # SAM bridge, ip:port (e.g. 127.0.0.1:7656); empty = I2P off
#i2pacceptincoming=1        # reserved; inbound I2P is not accepted

# --- Privacy: CJDNS ----------------------------------------------------------
# A CJDNS address is an fc00::/8 IPv6 address on cjdns's tun interface, so
# this needs working IPv6 on the host. Like Core, the node cannot detect the
# interface: you have to say it is there.
#cjdnsreachable=0

# --- Indexes and storage -----------------------------------------------------
# blockfilterindex and coinstatsindex always run; the keys only turn them
# OFF. The txid index is built OFFLINE (daemon/build_tx_index <datadir>) and
# picked up automatically when txindex.dat exists; txindex=1 is accepted and
# says so, but changes nothing.
#txindex=0                  # informational only, see above
#addrindex=0                # EXTENSION: live address index for the getaddress* RPCs
#blockfilterindex=1         # BIP157/158 basic filters (also accepts "basic")
#coinstatsindex=1           # gettxoutsetinfo without a full UTXO walk
#prune=0                    # 0 off, 1 manual-only, >=550 target size in MiB (2..549 refused, as in Core)
#dbcache=1024               # UTXO cache, MiB (4..262144); older Core releases default to 450
# UTXO store tuning (extensions).
#bmc.utxocompactthreshold=12 # UTXO runs that trigger a background compaction (x4 during bulk catch-up)
#bmc.utxobulkgapblocks=50000 # gap at boot (blocks) at which catch-up uses bulk mode
#bmc.bootcatchup=1          # 0 = skip the parallel block download at boot (a >=2000-block gap still triggers it later)
# ONE-SHOT: drop the persisted UTXO set and rebuild it from the archive on
# the next start. Consumed by writing reindex_chainstate.done and refused on
# later boots until the key is removed, so a forgotten line cannot rebuild
# the set on every restart.
#reindex-chainstate=0

# --- Mempool -----------------------------------------------------------------
#maxmempool=300             # MiB (1..65536); eviction and dynamic minfee kick in above this
#mempoolexpiry=336          # hours (0..8760)
#persistmempool=1           # write mempool.dat at shutdown, reload it at boot
# Fees are BTC/kvB as in Core; stored internally as sat/kvB so Core v30's
# 0.1 sat/vB defaults are representable. 0.00001 was the Core <= v29 default
# for both relay fees.
#minrelaytxfee=0.000001
#incrementalrelayfee=0.000001
#dustrelayfee=0.00003
#mempoolfullrbf=1
# Core v31 admits by CLUSTER (64 txs / 101 kvB); 25 is only its wallet
# default now. These are the limits the node enforces.
#limitancestorcount=64
#limitancestorsize=101      # kvB
#limitdescendantcount=64
#limitdescendantsize=101    # kvB
#datacarrier=1
#datacarriersize=100000     # vbytes (Core v31 default)
#acceptnonstdtxn=0
#bytespersigop=20           # fee rate is judged against max(vsize, sigop_cost * bytespersigop / 4)
#blocksonly=0               # 1 = do not relay transactions (relay=0 on every outbound leg)

# --- Validation --------------------------------------------------------------
# assumevalid is parsed and IGNORED on purpose: this node verifies every
# input script of every block it connects, ahead of any UTXO write, and
# assumevalid exists to skip exactly that.
#assumevalid=
#checkblocks=6              # blocks verified at start-up; 0 = all
#checklevel=3               # 0..4
#stopatheight=0             # shut down after connecting this height; 0 = never

# --- Resource limits ---------------------------------------------------------
#maxuploadtarget=0          # MiB per 24h; 0 = no limit
#par=0                      # script-verification / catch-up worker threads: 0 auto, negative = leave that many cores free (-64..64)

# --- ZMQ notifications -------------------------------------------------------
# A ZMQ publisher has NO authentication: whoever connects, subscribes, so
# the bind address is the entire access-control decision. `tcp://*:PORT` is
# REFUSED; name an interface (127.0.0.1 for local subscribers, 0.0.0.0 if
# you genuinely mean every interface). Topics sharing an address share a
# socket, as in Core. The bind happens at daemon start and a failure is
# reported once in the start-up log.
#zmqpubhashblock=           # e.g. tcp://127.0.0.1:28332
#zmqpubrawblock=
#zmqpubhashtx=              # e.g. tcp://127.0.0.1:28333
#zmqpubrawtx=
# zmqpubsequence is REFUSED, not ignored: the node has one choke point for
# mempool "add" but none for "remove" (eviction, expiry and reorg each remove
# independently), and a sequence stream with adds but no removes would let a
# subscriber's model of the mempool drift silently. Use rawtx/hashtx.
#zmqpubsequence=
# High-water marks: how far a slow subscriber may fall behind before messages
# are dropped. Core counts messages in its own queue; this publisher writes
# the socket directly and already drops rather than blocking, so the kernel
# send buffer IS the queue and these size it. Same property, different unit.
#zmqpubhashblockhwm=1000
#zmqpubhashtxhwm=1000
#zmqpubrawblockhwm=1000
#zmqpubrawtxhwm=1000
#zmqpubsequencehwm=1000     # parsed for compatibility; the topic itself is refused

# --- Wallet ------------------------------------------------------------------
# One wallet per chain directory. disablewallet=1 skips loading it; wallet
# RPCs then report that no wallet is loaded.
#disablewallet=0
#signer=                    # external signer command (Core -signer / HWI) for enumeratesigners, walletdisplayaddress
# Absolute path to a file holding the wallet passphrase. The file is REFUSED
# (loudly) if it is world-accessible, group-writable, or inside the datadir:
# a key next to the ciphertext it protects ends up in the same backup.
# Intended shape:
#     sudo install -d -m 0755 /etc/bmc
#     sudo install -o root -g <service group> -m 0640 secret /etc/bmc/wallet.pass
# $BMC_WALLET_PASS takes precedence when set, but an environment variable is
# visible in `systemctl show` and /proc/<pid>/environ.
#walletpassfile=            # e.g. /etc/bmc/wallet.pass; empty = environment only

# --- Chain security ----------------------------------------------------------
# The floor a header chain must clear before this node commits work to it:
# the defence against a peer feeding an enormous low-difficulty chain. Empty
# = the chain's own Core value (mainnet's is compiled in); regtest has none,
# as in Core. A value the 128-bit work accumulator cannot represent is
# REFUSED rather than truncated into something weaker than you asked for.
#minimumchainwork=          # 64 hex digits, big-endian (Core's uint256 spelling)

# --- Address diversity -------------------------------------------------------
# Bucket peers by autonomous system instead of IPv4 /16: one hosting
# provider routinely announces dozens of /16s from a single AS, which /16
# bucketing counts as diverse. Takes Core's asmap binary format unchanged; a
# relative path resolves against the per-chain datadir. If the file cannot
# be read the node says so and falls back to /16.
#asmap=                     # e.g. asmap.raw
# Address-message limits (extensions; Core compiles these in).
#bmc.addrmaxperresponse=256 # addresses taken from one peer's addr response (1..1000)
#bmc.addrmaxpernetgroup=16  # of those, at most this many per netgroup (1..256)

# --- Banning and peer permissions --------------------------------------------
# Peers that send malformed or abusive messages accumulate misbehaviour
# points and are banned at 100 for bantime seconds, inbound and outbound
# alike. setban/listbanned/clearbanned drive the same list by hand.
#bantime=86400              # seconds (24h)
# whitelist grants permissions by PEER address, whitebind (above) by which
# socket accepted it. Only `noban` is enforced; any other Core permission
# token is a start-up error naming it. A bare subnet with no permissions is
# Core's implicit set, of which this node grants noban and says so once.
#whitelist=                 # [noban@]addr[/prefix], IPv4 or IPv6 (repeatable)

# --- Relay policy ------------------------------------------------------------
# Bare multisig outputs are unprunable UTXO bloat; 0 stops relaying them.
# getmempoolinfo reports the value in force.
#permitbaremultisig=1

# --- Startup / operations ----------------------------------------------------
#networkactive=1            # 0 starts with networking off (as setnetworkactive false)
#forcednsseed=0             # 1 queries the DNS seeds even when dnsseed=0 or peers are plentiful
#pid=                       # write our pid here once the RPC port is bound; empty = no pid file
# The daemon's own leveled log. Relative to the chain directory, or absolute;
# 0 disables the file log entirely.
#debuglogfile=logs/bitcoind.log

# --- Notifications -----------------------------------------------------------
# Run a shell command when something happens. "%s" is replaced by the
# event's value, SANITISED to [A-Za-z0-9._:/-] first: the value reaches a
# shell, and while a hash is safe an alert message is attacker-influenced
# text. No quote, backtick, dollar, semicolon or pipe survives the filter.
#blocknotify=               # %s = block hash
#alertnotify=               # %s = a short machine-readable reason
#startupnotify=             # no substitution
#shutdownnotify=            # no substitution; runs before the cookie and pid file are removed

# --- BIP324 v2 encrypted transport -------------------------------------------
# Accept inbound v2 connections and attempt v2 on outbound ones. A v2
# connection starts with 64 bytes indistinguishable from random and has no
# plaintext message headers, so a passive observer cannot tell it from
# noise; chain separation lives in the key derivation rather than a magic on
# every message. Turning this OFF is safe and costs only privacy: inbound
# v1 peers are detected in band, and outbound goes straight to v1. Leaving
# it ON costs one extra TCP connection per v1-only outbound peer (the v2
# garbage is rejected as a bad magic, and the node redials as v1).
#v2transport=1

# =============================================================================
# CORE OPTIONS ACCEPTED WITH NO EFFECT
#
# Each of these is a real Bitcoin Core option the node recognises but does
# not implement. Setting one is not an error: the node names it on stderr at
# every start-up ("... is a Bitcoin Core option this node does not implement
# -- it has NO EFFECT") so a setting here is never a silent no-op.
#
#   whitelistrelay, whitelistforcerelay  relay permissions with no enforcement
#                                        point; only noban is honoured
#   txreconciliation                     Erlay is not implemented
#   natpmp, upnp                         no port-mapping client; forward the
#                                        port yourself or use externalip
#   peerbloomfilters                     BIP37 is not served (BIP157/158 is)
#   peerblockfilters                     BIP157/158 filters are always served;
#                                        the flag changes nothing
#   rpcthreads, rpcworkqueue,            the RPC server has no configurable
#   rpcservertimeout                     thread pool, queue depth or idle timeout
#   rest                                 no REST interface
#   server                               the RPC server always runs
#   reindex                              Core rebuilds its block index from the
#                                        blk files; this node's recovery path
#                                        is archive verify-and-repair, which
#                                        truncates and re-downloads instead
#                                        (reindex-chainstate IS implemented)
#   loadblock, blocksdir, blocksxor      block storage is the node's own
#                                        archive, not blk*.dat files
#   persistmempoolv1                     mempool.dat is written in one format
#   dbbatchsize, prevoutfetchthreads     LevelDB / prefetch tuning with no
#                                        counterpart in this UTXO store
#   uacomment                            the user agent string is fixed
#   maxtxfee                             parsed and stored, but no send path
#                                        consults it; bumpfee applies Core's
#                                        fixed 0.1 BTC cap
#   maxapsfee                            no avoid-partial-spends coin selection
#   blockmaxweight, blockmintxfee,       block-template tuning; getblocktemplate
#   blockversion, blockreservedweight    uses fixed values
#   walletnotify                         no per-wallet-transaction hook
#   settings, includeconf,               one config file, read once; no
#   allowignoredconf                     settings.json and no includes
#   fixedseeds                           no compiled-in seed list; peers come
#                                        from DNS seeds, peers2.dat and the
#                                        keys above
# =============================================================================

# =============================================================================
# CORE OPTIONS THAT DO NOT APPLY TO THIS NODE
#
# These belong to programs or modes this project does not ship, so they are
# neither honoured nor warned about. bitcoin-cli client options: rpcconnect,
# rpcwait, rpcwaittimeout, rpcclienttimeout, rpcwallet, stdin, stdinrpcpass,
# stdinwalletpassphrase, color, getinfo, netinfo, addrinfo, named, rpcid.
# GUI: choosedatadir, lang, min, resetguisettings, splash, uiplatform.
# bitcoin-tx / bench / wallet-tool: create, txid, json, filter, list,
# asymptote, sanity, dumpfile, output, generate, opt1, opt2, opt3.
# IPC: ipcbind, ipcconnect. Process control handled by systemd and the
# command line: daemon, daemonwait, conf, datadir, help, version. Test-only
# options: mocktime, testactivationheight, vbparams, test, checkaddrman,
# checkblockindex, checkmempool, fastprune, stopafterblockimport,
# capturemessages, limitclustercount, limitclustersize, unsafesqlitesync,
# walletcrosschain, walletrejectlongchains, acceptstalefeeestimates,
# maxsigcachesize, deprecatedrpc, printpriority, checkpoints. testnet
# (testnet3) is not run; use testnet4.
# =============================================================================

# =============================================================================
# CORE OPTIONS NOT SUPPORTED
#
# Real Core options the node does not read and does not warn about. Listed
# here so their absence above is a statement, not an omission.
#
# Logging -- this node has one fixed leveled log format; timestamps are
# always on, the file is set by debuglogfile:
#   debug, debugexclude        no per-category switches; levels are fixed
#   loglevel, loglevelalways   level is fixed per message
#   logips                     peer addresses are logged where relevant
#   logtimestamps, logtimemicros   always on, fixed resolution
#   logthreadnames, logsourcelocations   never emitted
#   logratelimit               no rate limiting of log lines
#   printtoconsole             stderr always receives the start-up report
#   shrinkdebugfile            the log is never truncated by the node; rotate
#                              it externally
#
# RPC server tuning:
#   rpcwhitelist, rpcwhitelistdefault   no per-user method whitelist; every
#                                       authenticated user may call every method
#   rpccookieperms             the cookie is always mode 0600
#
# Wallet -- one wallet per chain directory, fee handling is per RPC call:
#   wallet, walletdir          the wallet lives in the chain directory
#   fallbackfee, mintxfee, discardfee, consolidatefeerate, txconfirmtarget
#                              fee rate is given per call (fee_rate / conf_target)
#   walletrbf                  RBF is chosen per call (replaceable)
#   spendzeroconfchange        unconfirmed change is spendable
#   keypool                    keys are derived on demand; no keypool to pre-fill
#   addresstype, changetype    native segwit (bech32) throughout
#   avoidpartialspends         no partial-spend avoidance in coin selection
#   walletbroadcast            wallet transactions are always broadcast
#
# Network:
#   maxtipage                  initial-block-download is judged from the
#                              archive's gap to the network tip, not by age
#   inboundrelaypercent        inbound peers relay by their own flag
#   privatebroadcast           no separate private-broadcast connections
#   txsendrate                 no outbound transaction rate limit
#   signetseednode             use seednode= / addnode= with chain=signet
#
# Indexes:
#   txospenderindex            not built; gettxspendingprevout covers the
#                              mempool only
# =============================================================================
