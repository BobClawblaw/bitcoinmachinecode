# Bitcoin Core configuration — 100% AI-generated
# Node runs as a fully validating full node on Linux

# --- Network ---
rpcport=8332
port=8332
listen=1
maxconnections=256

# --- RPC auth (HTTP Basic; matches bitcoind's rpcuser/rpcpassword) ---
rpcuser=bitcoin
rpcpassword=bitcoin

# --- Blocks ---
dbcache=4096
prune=0
blocksonly=0

# --- Pruning (uncomment to enable)
# prune=5000

# --- Privacy ---
privacy=1
whitelist=rpc

# --- Indexing ---
# Enable UTXO, address, and transaction indexes for API queries
txindex=1

# --- Performance ---
paranoid=0
# --- Peer sourcing (Bitcoin Core key names) ---
# All four are read at boot. addnode/seednode/connect may be REPEATED
# (up to 32 each); only the default P2P port 8333 is supported for named
# peers, and an entry with any other port is rejected rather than
# silently dialled on 8333.
#
#   dnsseed=1            # query the DNS seeds (default 1)
#   seednode=<ip>        # getaddr from this node, then drop it
#   addnode=<ip>         # prefer this peer, and never auto-evict it
#   connect=<ip>         # use ONLY these peers; disables all discovery
#   connect=0            # no automatic connections at all
#
# As in Core, connect= implies dnsseed=0 and listen=0 unless those keys
# are set explicitly (order in this file does not matter).
