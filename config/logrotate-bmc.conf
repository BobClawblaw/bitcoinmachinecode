# Log rotation for the bmc-bitcoind production log.
# THE knob is `size`: rotation triggers when the log exceeds it, checked every
# 15 minutes by bmc-logrotate.timer (systemd). copytruncate because systemd
# holds the append fd open across rotation.
#
# THIS FILE IS THE SOURCE, NOT WHAT ROOT READS. logrotate (3.21) refuses a
# config that is group-writable OR not owned by root, so a copy inside the
# service-user-owned checkout can never be the live config -- the timer ran
# for a week and rotated NOTHING (audit 2026-09-02 N6). The unit reads the
# root-owned copy at /etc/bmc/logrotate-bmc.conf.
#
# THE `su` LINE NAMES THE SERVICE ACCOUNT, and this file deliberately does
# not hard-code it: the account name is host configuration, not source, and
# committing it publishes who runs the node. Substitute it at install time,
# as root, so the deployed config and the host can never disagree:
#
#     sudo sed "s/__SVCUSER__/$(id -un)/g" config/logrotate-bmc.conf \
#       | sudo install -m 0644 -o root -g root /dev/stdin \
#           /etc/bmc/logrotate-bmc.conf
#
# Run it as the service user (that is what `id -un` resolves), not under
# sudo's root. A leftover __SVCUSER__ makes logrotate fail loudly on the next
# timer tick, which is the safe direction: a wrong-but-plausible username
# would silently rotate as the wrong account.
#
# Never let the unit copy this file automatically: a file the service user
# can write must not become root's logrotate config (postrotate scripts run
# as root).
#
# WHY `su` AT ALL (N6): the rotation runs as the service user, not root, so a
# symlink or inode swap in the service-user-owned log directory can never make
# root copy or truncate a file that account could not touch anyway. For that
# the logs must be owned by it: systemd creates bitcoin.main.log as root:root
# the first time; it was chown'ed once (2026-09-02) and the inode persists
# across restarts, because copytruncate never unlinks it.
/storage/bitcoinmachinecode/logs/*/*.log {
    su __SVCUSER__ __SVCUSER__
    size 2M
    rotate 60
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
