# Log rotation for the bmc-bitcoind production log.
# THE knob is `size`: rotation triggers when the log exceeds it, checked every
# 15 minutes by bmc-logrotate.timer (systemd). copytruncate because systemd
# holds the append fd open across rotation.
#
# THIS FILE IS THE SOURCE, NOT WHAT ROOT READS. logrotate (3.21) refuses a
# config that is group-writable OR not owned by root, so a copy inside the
# svc-owned checkout can never be the live config -- the timer ran for a
# week and rotated NOTHING (audit 2026-09-02 N6). The unit reads the
# root-owned copy at /etc/bmc/logrotate-bmc.conf. After editing here,
# install it deliberately, as root:
#     sudo install -m 0644 -o root -g root config/logrotate-bmc.conf /etc/bmc/
# Never let the unit copy it automatically: a file the service user can write
# must not become root's logrotate config (postrotate scripts run as root).
#
# `su svc svc` (N6): the rotation itself runs as the service user, not
# root, so a symlink or inode swap in the svc-owned log directory can never
# make root copy or truncate a file svc could not touch anyway. For that the
# logs must be owned by svc: systemd creates bitcoin.main.log as root:root
# the first time; it was chown'ed once (2026-09-02) and the inode persists
# across restarts, because copytruncate never unlinks it.
/storage/bitcoinmachinecode/logs/*/*.log {
    su svc svc
    size 2M
    rotate 60
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
