# Log rotation for the bmc-bitcoind production log.
# THE knob is `size`: rotation triggers when the log exceeds it, checked every
# 15 minutes by bmc-logrotate.timer (systemd). Edit here; nothing else to
# touch -- /etc/systemd/system/bmc-logrotate.service points at this file.
# copytruncate because systemd holds the append fd open across rotation.
/storage/bitcoinmachinecode/logs/*/*.log {
    size 2M
    rotate 60
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
