# Bitcoin Core v31.1 -- LOGGED IBD benchmark (rerun #6), 2026-10-04.
# Plan: worklog/2026-10-04-logged-ibd-runs-plan.md. Launcher:
# validation/logged_pair_run.sh, which copies this file to
# /srv/nvme8tb/bench/core31/bitcoin.conf (the path the bitcoin-core-bench unit
# reads) in a fresh, empty datadir.
#
# WHAT IT IS FOR. Module-level timing of Core's IBD, from its log only, so it
# can be set against bmc run 34 (bmc.benchlog=1, bmc.dlshape=core) stage by
# stage and segment by segment (validation/ibd_stage_report.py). Its wall clock
# is checked against rerun #5, the same settings WITHOUT the debug lines: the
# difference is the logging overhead.
#
# EVERYTHING BELOW THE "LOGGING" BLOCK IS RERUN #4's CONFIG, LINE FOR LINE
# (/srv/nvme8tb/bench/core31-20260930-rerun4-logs/bitcoin.conf, 11 h 01 m to
# 968,987; rerun #5 used the same lines). Change nothing there: a difference in
# settings is a difference in the measurement.

datadir=/srv/nvme8tb/bench/core31

# Ports 8338 (P2P) / 8340 (RPC), ZMQ 28434: cannot collide with the oracle
# (8333/8335), production (8332/8331) or a bmc bench (8462/8461). NOT 8339:
# with no bind= line Core also binds its onion listener on 127.0.0.1 at P2P+1.
port=8338
rpcport=8340
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
server=1
listen=1
# 48, as every baseline; download peers are Core's fixed 8 full-relay + 2
# block-relay-only outbound either way.
maxconnections=48

# The protocol: dbcache 8 GiB, all three indexes, no pruning.
dbcache=8192
txindex=1
coinstatsindex=1
blockfilterindex=1
prune=0

printtoconsole=0
# Keep the whole timeline if anything ever restarts the node (Core trims a
# debug.log over 10 MB to its last 10 MB at startup otherwise). It changes
# nothing while the node runs. Here it also protects ~1 GB of bench lines.
shrinkdebugfile=0

# The four ZMQ topics, published to nobody (bmc publishes the same four; a
# publisher with no subscriber costs the same on both sides).
zmqpubhashblock=tcp://127.0.0.1:28434
zmqpubhashtx=tcp://127.0.0.1:28434
zmqpubrawblock=tcp://127.0.0.1:28434
zmqpubrawtx=tcp://127.0.0.1:28434

# ---- LOGGING (the only difference from rerun #4/#5) ------------------------
#
# debug=bench: the per-block stage timers in Chainstate::ConnectTip and
# ConnectBlock (validation.cpp). The timers run in every build; this only
# prints them. 12 lines per connected block (13 when the block was cached):
#   Load block from disk | Sanity checks | Fork checks | Connect N transactions
#   | Verify N txins | Write undo data | Index writing | Connect total | Flush
#   | Writing chainstate | Connect postprocess | Connect block
# NB "Verify" is measured from the same start as "Connect N transactions"
# (time_4 - time_2), so it CONTAINS the connect time; the report subtracts it.
# Also the timer lines around each UTXO flush ("BatchWrite: write coins cache
# to disk (D out of C cached coins) completed (X ms)", "write block index to
# disk", "write block and undo data to disk").
debug=bench
# debug=coindb: each chainstate write ("Writing chainstate to disk: flush
# mode=..."), its partial/final LevelDB batches and the "Committed N changed
# transaction outputs" line. A handful per flush; negligible volume.
debug=coindb
# Microsecond timestamps: a block connects in well under a second for most of
# the chain, so second-resolution stamps cannot place a segment boundary or
# time a flush from its first to its last line.
logtimemicros=1
#
# LOG VOLUME, measured against rerun #4: its default-logging debug.log was
# 237 MB (one ~250-byte UpdateTip line per block plus startup/peer lines).
# The twelve bench lines of one block, written out at realistic widths with
# the microsecond stamp, come to ~1,090 bytes (69 for "Load block", 131 for
# "Connect N transactions", ~90 for the rest): ~1.1 KB x ~970,000 blocks =
# ~1.05 GB more, plus ~7 MB for the stamps' microseconds: ~1.3 GB in all.
# LogDebug lines are never rate-limited (util/log.h: "No rate limiting is
# applied" under -debug), so none is dropped; UpdateTip opts out of the limiter
# explicitly. The device (/srv/nvme8tb) writes that in seconds; the cost being
# measured is the formatting and the logger's lock, ~12 per block.
